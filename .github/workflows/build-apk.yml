name: Build NOX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NOX-Android-Studio/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: NOX-Android-Studio

    steps:
      - name: Checkout NOX
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NOX-Android-Studio/web/package.json

      - name: Install & build web assets
        working-directory: NOX-Android-Studio/web
        run: |
          npm install --no-audit --no-fund
          npm run build
          ls -la dist/
          test -f dist/index.html || (echo "ERROR: dist/index.html missing after build" && exit 1)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify assets inside APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/web/index.html|assets/web/assets/' || true
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/index.html' || (echo "ERROR: index.html not packaged in APK" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOX-APK
          path: NOX-Android-Studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
